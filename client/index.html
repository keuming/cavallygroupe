  <style>
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      background: linear-gradient(135deg, #005f8a 0%, #0080b8 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #splash.hidden { opacity: 0; visibility: hidden; }
    #splash-logo { 
      width: 80px; height: 80px; background: white; border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; margin-bottom: 20px;
      animation: splash-bounce 0.6s ease;
    }
    #splash-title { color: white; font-size: 24px; font-weight: 800; font-family: sans-serif; }
    #splash-sub { color: rgba(255,255,255,0.7); font-size: 13px; margin-top: 8px; font-family: sans-serif; }
    #splash-bar { 
      width: 120px; height: 3px; background: rgba(255,255,255,0.3);
      border-radius: 2px; margin-top: 30px; overflow: hidden;
    }
    #splash-progress { 
      height: 100%; background: white; border-radius: 2px;
      animation: splash-load 1.2s ease forwards;
    }
    @keyframes splash-bounce { 0%{transform:scale(0.5);opacity:0} 80%{transform:scale(1.1)} 100%{transform:scale(1);opacity:1} }
    @keyframes splash-load { from{width:0} to{width:100%} }
  </style>
  </head>

    <div id="splash-bar"><div id="splash-progress"></div></div>
  </div>
  <script>
    window.addEventListener('load', function() {
      setTimeout(function() {
        var s = document.getElementById('splash');
        if(s) { s.classList.add('hidden'); setTimeout(function(){ if(s) s.remove(); }, 500); }
      }, 1500);
    });
  </script>
